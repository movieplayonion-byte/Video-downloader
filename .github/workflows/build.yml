name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK and AAB
        run: |
          chmod +x gradlew || true
          gradle assembleRelease bundleRelease --no-configuration-cache --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          # Find any generated apk and copy as VideoDownloader.apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_assets/VideoDownloader.apk \;
          # Find any generated aab and copy as VideoDownloader.aab
          find app/build/outputs/bundle -name "*.aab" -exec cp {} release_assets/VideoDownloader.aab \;
          ls -la release_assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release_assets/VideoDownloader.apk
          if-no-files-found: error

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: release_assets/VideoDownloader.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Video Downloader Latest Release"
          body: "Direct public download links for APK and AAB Bundle."
          draft: false
          prerelease: false
          files: |
            release_assets/VideoDownloader.apk
            release_assets/VideoDownloader.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
