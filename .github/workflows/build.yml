name: Build Video Downloader

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Keystore & Build
        run: |
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VideoDownloader,O=Android,C=US"
          gradle assembleDebug bundleDebug -x test -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VideoDownloader-APK
          path: "**/build/outputs/apk/**/*.apk"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VideoDownloader-AAB
          path: "**/build/outputs/bundle/**/*.aab"
