name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK and AAB
        run: |
          chmod +x gradlew || true
          gradle assembleRelease bundleRelease --no-configuration-cache --stacktrace

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_assets/VideoDownloader.apk \;
          find app/build/outputs/bundle -name "*.aab" -exec cp {} release_assets/VideoDownloader.aab \;

      - name: Publish Fresh Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Video Downloader Release v${{ github.run_number }}"
          body: "Stable release."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_assets/VideoDownloader.apk
            release_assets/VideoDownloader.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
