name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK & AAB
        run: |
          gradle assembleRelease bundleRelease --no-configuration-cache --stacktrace
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/VideoDownloader.apk

      - name: Delete Old Latest Release Tag
        run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Fresh GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Video Downloader v${{ github.run_number }}"
          body: "Direct public download links for APK and AAB Bundle."
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/VideoDownloader.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto Update version.json on Release
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cat << EJSON > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "2.8.${{ github.run_number }}",
            "apkUrl": "https://github.com/movieplayonion-byte/Video-downloader/releases/latest/download/VideoDownloader.apk",
            "changeLog": "Automated mandatory update with latest fixes."
          }
          EJSON
          git add version.json
          git commit -m "Auto update version.json to build ${{ github.run_number }} [skip ci]" || true
          git push origin main || true
